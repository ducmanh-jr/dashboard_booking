name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore core_api/NowayhomeDashboard.slnx

    - name: Build Solution
      run: dotnet build core_api/NowayhomeDashboard.slnx --no-restore -c Release

    - name: Run Tests
      run: dotnet test core_api/NowayhomeDashboard.slnx --no-build -c Release --verbosity normal

  docker-publish:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Downcase Repository Name
      run: |
        echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: ./core_api
        file: ./core_api/Dockerfile
        push: true
        tags: |
          ghcr.io/${{ env.REPO_LC }}/nowayhome-core-api:latest
          ghcr.io/${{ env.REPO_LC }}/nowayhome-core-api:${{ github.sha }}
